name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua runtime
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check firmware scripts and direct forwarding tests
        run: |
          luac -p main.lua direct_forward.lua forward_config.lua
          lua tests/lua/direct_forward_test.lua

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Run Go tests
        run: go test ./...

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build native Windows package
        shell: pwsh
        run: .\scripts\windows\build.ps1 -Architecture amd64 -Version ci
      - name: Verify package with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows\verify-package.ps1 -ArchivePath .\dist\uart_sms_forwarder-windows-amd64.zip -Version ci
