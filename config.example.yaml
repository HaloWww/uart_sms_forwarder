database:
  enabled: true
  type: sqlite
  sqlite:
    path: "./data/app.db"
  show_sql: false
log:
  level: debug # 日志等级  debug,info,waring,error
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  # JWT配置
  JWT:
    # 随机生成一个 32 字节的字符串，推荐使用 openssl rand -base64 32 生成
    Secret: ""
    ExpiresHours: 168 # 7天
  Users:
    # 使用 Bcrypt 加密，默认密码为 admin123，建议首次登录后修改密码，搜索 bcrypt在线加密网站 即可
    admin: "$2y$12$7DXcOiX1D59xNTIn5riUKusAPLP88LxxoczWmUT83MBj5EFznbp8a"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  # 串口配置
  Serial:
    # 自动发现并管理所有烧录了本项目 main.lua 1.4.0+ 的 Air780。
    # 省略整个 Serial 配置时也默认启用自动发现。
    AutoDiscover: true
    # 可选：有其他 USB 串口设备时，只允许探测下列端口；这不是 SIM 身份配置。
    # Ports:
    #   - "/dev/ttyUSB0"
    #   - "/dev/ttyUSB1"
    # Windows 请填写设备管理器中显示的端口名，例如：
    #   - "COM3"
    #   - "COM4"
